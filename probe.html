<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quest capability probe</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        background: #0b0b0c;
        color: #f2efe6;
        font: 14px/1.7 ui-monospace, monospace;
      }
      h1 {
        font-size: 15px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #e2231a;
      }
      .row {
        display: flex;
        gap: 12px;
        padding: 7px 0;
        border-bottom: 1px solid rgba(242, 239, 230, 0.12);
      }
      .k { flex: 0 0 300px; color: rgba(242, 239, 230, 0.55); }
      .v { flex: 1; }
      .yes { color: #35d07f; }
      .no { color: #e2231a; }
      button {
        margin: 16px 8px 16px 0;
        padding: 11px 18px;
        background: transparent;
        border: 1px solid rgba(242, 239, 230, 0.4);
        color: #f2efe6;
        font: inherit;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        cursor: pointer;
      }
      pre {
        white-space: pre-wrap;
        color: rgba(242, 239, 230, 0.6);
      }
    </style>
  </head>
  <body>
    <h1>Capability probe</h1>
    <p>
      Open this on the Quest to find out exactly what the browser exposes.
      Camera checks need a user gesture, so press the buttons.
    </p>
    <div id="out"></div>
    <button id="cam">Test camera access</button>
    <button id="xr">Test WebXR camera + hands</button>
    <pre id="log"></pre>

    <script type="module">
      const out = document.getElementById('out');
      const log = document.getElementById('log');

      const row = (k, v, ok) => {
        const el = document.createElement('div');
        el.className = 'row';
        el.innerHTML =
          `<div class="k">${k}</div>` +
          `<div class="v ${ok === true ? 'yes' : ok === false ? 'no' : ''}">${v}</div>`;
        out.appendChild(el);
      };

      row('User agent', navigator.userAgent);
      row('navigator.xr', 'xr' in navigator ? 'present' : 'missing', 'xr' in navigator);
      row(
        'mediaDevices.getUserMedia',
        navigator.mediaDevices?.getUserMedia ? 'present' : 'missing',
        !!navigator.mediaDevices?.getUserMedia
      );
      row('isSecureContext', String(window.isSecureContext), window.isSecureContext);

      if (navigator.xr) {
        for (const mode of ['immersive-ar', 'immersive-vr']) {
          navigator.xr
            .isSessionSupported(mode)
            .then((s) => row(`isSessionSupported('${mode}')`, String(s), s))
            .catch((e) => row(`isSessionSupported('${mode}')`, e.message, false));
        }
      }

      document.getElementById('cam').onclick = async () => {
        try {
          const devices = await navigator.mediaDevices.enumerateDevices();
          const cams = devices.filter((d) => d.kind === 'videoinput');
          row('Video input devices', String(cams.length), cams.length > 0);
          for (const c of cams) row('  device', `${c.label || '(no label)'} ${c.deviceId.slice(0, 12)}`);
        } catch (e) {
          row('enumerateDevices', e.name + ': ' + e.message, false);
        }

        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: true });
          const track = stream.getVideoTracks()[0];
          row('getUserMedia({video:true})', 'GRANTED — ' + track.label, true);
          const s = track.getSettings();
          row('  settings', JSON.stringify(s));
          stream.getTracks().forEach((t) => t.stop());
        } catch (e) {
          row('getUserMedia({video:true})', e.name + ': ' + e.message, false);
        }
      };

      document.getElementById('xr').onclick = async () => {
        if (!navigator.xr) return row('WebXR', 'unavailable', false);
        // camera-access is the WebXR module that would hand a page the raw
        // passthrough image. Requesting it as optional tells us whether the
        // runtime grants it without failing the session if it does not.
        try {
          const session = await navigator.xr.requestSession('immersive-ar', {
            optionalFeatures: ['camera-access', 'hand-tracking', 'hit-test'],
            requiredFeatures: ['local-floor'],
          });
          const granted = [...(session.enabledFeatures ?? [])];
          row('Session started', 'immersive-ar', true);
          row(
            'enabledFeatures',
            granted.length ? granted.join(', ') : '(not reported by runtime)'
          );
          row(
            "camera-access granted",
            String(granted.includes('camera-access')),
            granted.includes('camera-access')
          );
          row(
            'hand-tracking granted',
            String(granted.includes('hand-tracking')),
            granted.includes('hand-tracking')
          );

          // If camera-access really is granted, XRView gets a .camera
          const ref = await session.requestReferenceSpace('local-floor');
          session.requestAnimationFrame((t, frame) => {
            const pose = frame.getViewerPose(ref);
            const view = pose?.views?.[0];
            row('XRView.camera present', String(!!view?.camera), !!view?.camera);
            if (view?.camera) {
              row('  camera size', `${view.camera.width}x${view.camera.height}`);
            }
            let hands = 0;
            for (const src of session.inputSources) if (src.hand) hands++;
            row('Input sources with .hand', String(hands), hands > 0);
            session.end();
          });
        } catch (e) {
          row('requestSession', e.name + ': ' + e.message, false);
          log.textContent += '\n' + (e.stack ?? '');
        }
      };
    </script>
  </body>
</html>
